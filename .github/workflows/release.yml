name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [armhf, arm64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Debian package for ${{ matrix.arch }}
      run: |
        # Determine Docker platform
        if [ "${{ matrix.arch }}" = "armhf" ]; then
          DOCKER_ARCH="linux/arm/v7"
        else
          DOCKER_ARCH="linux/arm64"
        fi
        
        # Build in Docker container
        docker run --rm --platform $DOCKER_ARCH \
          -v $PWD:/workspace \
          -w /workspace \
          debian:bookworm-slim \
          bash -c "
            apt-get update && \
            apt-get install -y build-essential libgtk-3-dev pkg-config debhelper dpkg-dev && \
            dpkg-buildpackage -us -uc -b -a${{ matrix.arch }} && \
            mv ../*.deb .
          "
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.arch }}
        path: "*.deb"
        retention-days: 1
  
  create-release:
    needs: build-deb
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download armhf artifact
      uses: actions/download-artifact@v4
      with:
        name: deb-armhf
        path: ./debs
    
    - name: Download arm64 artifact
      uses: actions/download-artifact@v4
      with:
        name: deb-arm64
        path: ./debs
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./debs/*.deb
          CHANGELOG.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
